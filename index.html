<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Garden Pro - City & Farm Edition 3D</title>
    <style>
        :root {
            --bg-dark: #14181d;
            --panel: #232b33;
            --accent: #6fcf6f;
            --pink-flag: #ef5777;
            --gold: #f4c542;
            --fwd: #05c46b; --bwd: #ff5e57; --lft: #3c6df0; --rgt: #ffa801;

            --grass-a: #6cbf5a; --grass-b: #5aa84a;
            --pave-a: #b9c2ca; --pave-b: #99a4ad;
            --dirt-a: #a9764f; --dirt-b: #8a5d3b;
            --asphalt-a: #3a3f45; --asphalt-b: #24272b;
            --tilt: 48deg;
            --u: min(1px, calc(100vh / 780)); /* đơn vị co giãn cho cột trái theo chiều cao màn hình */
            --board-frame: #7a5230; --board-frame-dark: #5c3d22;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, Helvetica, sans-serif; font-weight: 700;
            background: radial-gradient(ellipse at top, #1c2530 0%, var(--bg-dark) 70%);
            color: white; height: 100vh; width: 100vw;
            display: flex; flex-direction: column; align-items: center; overflow: hidden;
            user-select: none;
        }

        .header { height: 9vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .header h1 { font-size: 24px; color: var(--accent); letter-spacing: 1px; text-shadow: 0 0 10px rgba(111, 207, 111, 0.35); }
        .status-msg { color: #dcdde1; font-size: 16px; margin-top: 4px; font-weight: 700; min-height: 20px; }

        .main-container { display: flex; width: 95vw; height: 83vh; max-width: 1600px; gap: 20px; }

        .sidebar {
            flex: 1; background: var(--panel); border-radius: 22px;
            padding: calc(var(--u) * 14); display: flex; flex-direction: column; gap: calc(var(--u) * 10);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05);
            min-width: 280px; max-width: 330px; overflow-y: auto; overflow-x: hidden;
        }
        .sidebar, .sidebar * { font-family: Arial, Helvetica, sans-serif; font-weight: 700; }
        .sidebar button { letter-spacing: 0.3px; }
        .section { display: flex; flex-direction: column; gap: calc(var(--u) * 6); }
        .section-label {
            display: flex; justify-content: space-between; align-items: center;
            font-size: max(10px, calc(var(--u) * 10)); letter-spacing: 1px; text-transform: uppercase; color: #8fa0ad;
        }
        .section-label b { color: var(--accent); letter-spacing: 0.3px; text-transform: none; }

        /* Tab chọn bản đồ */
        .theme-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u) * 6); }
        .tab-btn {
            height: calc(var(--u) * 46); padding: 0 2px; border-radius: calc(var(--u) * 10); border: 2px solid transparent; cursor: pointer;
            background: rgba(255,255,255,0.06); color: #bdc3c7; font-size: max(10px, calc(var(--u) * 11)); line-height: 1.15; white-space: nowrap;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 2);
            transition: 0.2s;
        }
        .tab-btn .ico { font-size: max(14px, calc(var(--u) * 18)); line-height: 1; }
        .tab-btn:hover { background: rgba(255,255,255,0.12); }
        .tab-btn.active { background: rgba(111,207,111,0.18); border-color: var(--accent); color: #fff; }

        .grid-area {
            flex: 2.2; background: linear-gradient(180deg, #1a2229, #10151a); border-radius: 22px;
            display: flex; justify-content: center; align-items: center;
            border: 1px solid rgba(255,255,255,0.05); position: relative; overflow: hidden;
            perspective: 1600px;
        }

        /* ===== 3D BOARD (tĩnh, nhìn thẳng) ===== */
        .board-stage {
            transform-style: preserve-3d;
            transform: rotateX(var(--tilt));
            width: 74%;
            aspect-ratio: 1/1;
            position: relative;
        }
        .board-stage.shake { animation: shakeBoard 1.4s; }

        @keyframes shakeBoard {
            0%, 100% { transform: rotateX(var(--tilt)) translate(0,0); }
            20% { transform: rotateX(var(--tilt)) translate(8px, -5px); }
            40% { transform: rotateX(var(--tilt)) translate(-7px, 4px); }
            60% { transform: rotateX(var(--tilt)) translate(5px, 3px); }
            80% { transform: rotateX(var(--tilt)) translate(-4px, -2px); }
        }

        .board-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 5px;
            width: 100%;
            height: 100%;
            background: linear-gradient(160deg, #8b5e34, #6b4226);
            padding: 16px;
            border-radius: 12px;
            position: relative;
            transform-style: preserve-3d;
            box-shadow:
                0 0 0 3px #5c3d22,
                0 28px 0 #4a3018,
                0 32px 50px rgba(0,0,0,0.65),
                inset 0 2px 8px rgba(255,255,255,0.12);
        }

        .grid-container::before {
            content: '';
            position: absolute;
            left: 0; right: 0; bottom: -28px;
            height: 28px;
            background: linear-gradient(to bottom, #5c3d22, #3d2a14);
            transform: rotateX(-90deg);
            transform-origin: top;
            border-radius: 0 0 10px 10px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.5);
        }

        .cell {
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            transition: 0.25s;
            position: relative;
            transform-style: preserve-3d;
            transform: translateZ(4px);
        }

        .ground-farm {
            background: linear-gradient(155deg, var(--grass-a), var(--grass-b));
            box-shadow:
                inset 0 -5px 0 rgba(0,0,0,0.22),
                0 5px 0 rgba(0,0,0,0.3),
                0 8px 12px rgba(0,0,0,0.25);
        }
        .ground-city {
            background: linear-gradient(155deg, var(--pave-a), var(--pave-b));
            box-shadow:
                inset 0 -5px 0 rgba(0,0,0,0.22),
                0 5px 0 rgba(0,0,0,0.3),
                0 8px 12px rgba(0,0,0,0.25);
        }

        .ground-jungle {
            background:
                radial-gradient(circle at 22% 28%, rgba(120,200,80,0.35) 0 14%, transparent 15%),
                radial-gradient(circle at 74% 66%, rgba(20,80,40,0.45) 0 16%, transparent 17%),
                linear-gradient(155deg, #3f9a3d, #1f6b35);
            box-shadow:
                inset 0 -5px 0 rgba(0,0,0,0.28),
                0 5px 0 rgba(0,0,0,0.32),
                0 8px 12px rgba(0,0,0,0.25);
        }
        .road-jungle {
            background:
                radial-gradient(circle at 30% 35%, rgba(255,255,255,0.12) 0 8%, transparent 9%),
                radial-gradient(circle at 68% 70%, rgba(0,0,0,0.18) 0 9%, transparent 10%),
                linear-gradient(155deg, #c99a5b, #a87b42);
            border: 3px solid #2f7d3a;
            box-shadow:
                inset 0 -5px 0 rgba(0,0,0,0.25),
                0 5px 0 rgba(0,0,0,0.35);
        }

        .road-farm {
            background: linear-gradient(155deg, var(--dirt-a), var(--dirt-b));
            border: 3px solid #7cc25f;
            box-shadow:
                inset 0 -5px 0 rgba(0,0,0,0.25),
                0 5px 0 rgba(0,0,0,0.35);
        }
        .road-city {
            background: repeating-linear-gradient(90deg, var(--asphalt-a) 0 60%, #e8e8e8 60% 68%, var(--asphalt-a) 68% 100%);
            background-size: 46% 100%;
            border: 1px solid #1a1c1f;
            box-shadow:
                inset 0 -5px 0 rgba(0,0,0,0.4),
                0 5px 0 rgba(0,0,0,0.45);
        }

        .decor {
            opacity: 0.95;
            font-size: 1.45rem;
            pointer-events: none;
            filter: drop-shadow(0 4px 4px rgba(0,0,0,0.45));
            transform: translateZ(8px);
        }


        /* ===== NHÃN TÊN MỤC TIÊU (luôn dựng đứng, hướng về người xem) ===== */
        .target-icon { display: inline-block; }
        .target-label {
            position: absolute;
            left: 50%; bottom: 52%;
            transform-origin: 50% 100%;
            transform: translateX(-50%) translateZ(10px) rotateX(calc(var(--tilt) * -1)) scale(var(--ls, 1));
            padding: 3px 9px;
            font-size: 14px; font-weight: 800; line-height: 1.3;
            white-space: nowrap;
            color: #fff;
            background: rgba(20, 24, 29, 0.88);
            border: 1.5px solid rgba(255,255,255,0.55);
            border-radius: 999px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.45);
            pointer-events: none;
            z-index: 6;
        }
        .cell.target-cell .target-label {
            background: var(--gold); color: #2b2200; border-color: #fff;
        }
        .cell.fx-hole .target-label, .cell.fx-mine .target-label { opacity: 0; }

        .cell.highlight-start {
            background: var(--pink-flag) !important;
            cursor: pointer;
            box-shadow: 0 0 28px var(--pink-flag), 0 6px 0 rgba(0,0,0,0.3);
            animation: pulse 1s infinite;
        }
        .cell.target-tile { cursor: default; }
        .cell.selectable-target {
            cursor: pointer;
            outline: 3px dashed rgba(244, 197, 66, 0.9);
            outline-offset: -3px;
            animation: pulseTarget 1s infinite;
        }
        .cell.target-cell::before {
            content: '⭐';
            position: absolute;
            top: -12px; right: -8px;
            font-size: 1.1rem;
            filter: drop-shadow(0 0 8px var(--gold));
            animation: pulse 1.1s infinite;
            z-index: 5;
        }

        .target-badge {
            position: absolute; top: -12px; left: -10px; z-index: 6;
            min-width: 26px; height: 26px; border-radius: 50%;
            background: var(--gold); color: #2b2200; border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 800;
            box-shadow: 0 3px 8px rgba(0,0,0,0.5);
        }
        .cell.target-reached .target-badge { background: var(--accent); color: #08210f; }
        .cell.target-reached { box-shadow: 0 0 22px 4px rgba(111,207,111,0.8); }
        .cell.target-wrong { box-shadow: 0 0 22px 4px rgba(255,94,87,0.8); }

        .cell.target-tile { cursor: grab; touch-action: none; }
        .cell.dragging-src { opacity: 0.35; }
        .cell.drop-hover { outline: 4px solid #fff; outline-offset: -4px; filter: brightness(1.3); }
        .cell.drop-denied { outline: 4px solid #ff5e57; outline-offset: -4px; }
        #drag-ghost {
            position: fixed; z-index: 9999; pointer-events: none;
            font-size: 52px; transform: translate(-50%, -60%);
            filter: drop-shadow(0 10px 12px rgba(0,0,0,0.6));
        }

        @keyframes pulse { 50% { opacity: 0.45; } }
        @keyframes pulseTarget { 50% { outline-color: rgba(244, 197, 66, 0.25); } }

        .cell.fx-hole { animation: holeSink 2.8s forwards; }
        @keyframes holeSink {
            0% { background: radial-gradient(circle, #222 0%, var(--dirt-b) 55%); transform: translateZ(4px); }
            100% {
                background: radial-gradient(circle, #000 35%, #111 100%);
                box-shadow: inset 0 22px 28px rgba(0,0,0,0.95);
                transform: translateZ(-6px);
            }
        }
        .cell.fx-mine { animation: mineFlash 0.9s 3; }
        @keyframes mineFlash {
            0%, 100% { filter: none; }
            50% { background: #ff5e2e !important; box-shadow: 0 0 45px #ff5e2e; filter: brightness(1.4); }
        }
        .cell.fx-success { animation: successGlow 0.95s ease-out; }
        @keyframes successGlow {
            0% { box-shadow: 0 0 0 rgba(244,197,66,0); }
            45% { box-shadow: 0 0 50px 14px var(--gold); }
            100% { box-shadow: none; }
        }

        /* ROBOT 3D */
        #robot {
            position: absolute;
            width: 80%; height: 75%;
            z-index: 100;
            display: none;
            cursor: pointer;
            transition: left 0.55s ease, top 0.55s ease, transform 0.4s ease, opacity 0.5s ease;
            transform-style: preserve-3d;
        }
        .bot-rig {
            position: absolute; inset: 0;
            transform-style: preserve-3d;
            transform: translateY(10%);
        }
        .bot-body {
            position: absolute; inset: 0;
            background: linear-gradient(160deg, #5da8ff, #2f6fd6);
            border-radius: 14px;
            border: 2px solid #8fc2ff;
            box-shadow: 0 3px 0 #1f4a91, 0 5px 8px rgba(0,0,0,0.5);
            transform: translateZ(2px);
        }
        .bot-visor {
            position: absolute; left: 14%; right: 14%; top: 16%; height: 30%;
            background: linear-gradient(160deg, #ffe08a, #ffb703);
            border-radius: 10px;
            transform: translateZ(3px);
            box-shadow: inset 0 -3px 4px rgba(0,0,0,0.25);
        }
        .bot-tread {
            position: absolute; bottom: -4px;
            width: 34%; height: 15%;
            background: #ff5e57;
            border-radius: 6px;
            box-shadow: inset 0 -3px 0 #a11;
            transform: translateZ(1px);
        }
        .bot-tread.l { left: 4%; } .bot-tread.r { right: 4%; }
        .arm {
            position: absolute; width: 10%; height: 30%;
            background: #ffce54; top: -14%;
            border-radius: 4px;
            border-bottom: 5px solid #cc9a1f;
            transform-origin: bottom center;
            transform: translateZ(3px);
        }
        .arm::after {
            content: '';
            position: absolute; top: -8%; left: -15%;
            width: 130%; height: 18%;
            background: #fff; border-radius: 40%;
        }
        .arm.l { left: 14%; } .arm.r { right: 14%; }
        .eye {
            position: absolute; width: 15%; height: 15%;
            background: #55efc4; border-radius: 50%;
            top: 42%;
            box-shadow: 0 0 14px #55efc4;
            transition: background 0.3s, box-shadow 0.3s;
            transform: translateZ(4px);
        }
        .eye.l { left: 22%; } .eye.r { right: 22%; }
        .antenna {
            position: absolute; width: 4px; height: 18%;
            background: #d2dae2;
            top: -32%; left: 50%;
            transform: translateX(-50%) translateZ(3px);
        }
        .antenna::after {
            content: '';
            position: absolute; top: -9px; left: 50%;
            transform: translateX(-50%);
            width: 11px; height: 11px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 12px var(--gold);
            animation: pulse 0.8s infinite;
        }
        .dir-arrow {
            position: absolute; top: -20%; left: 50%;
            transform: translateX(-50%) translateZ(5px);
            font-size: 1.15rem;
            filter: drop-shadow(0 0 5px #fff);
        }

        #robot.state-thinking .eye { background: var(--gold); box-shadow: 0 0 14px var(--gold); }
        #robot.state-success { animation: botCelebrate 0.75s ease; }
        @keyframes botCelebrate {
            0%, 100% { transform: translateZ(6px) scale(1); }
            40% { transform: translateZ(70px) scale(1.18); }
        }
        #robot.state-fail-hole { animation: botSink 2.8s ease-in forwards; }
        @keyframes botSink {
            0% { opacity: 1; }
            100% { transform: translateZ(-50px) scale(0.12) rotate(25deg); opacity: 0; }
        }
        #robot.state-fail-mine { animation: botExplode 1.6s ease forwards; }
        @keyframes botExplode {
            0% { opacity: 1; }
            55% { transform: scale(1.25); filter: brightness(2.6) saturate(0.25); }
            100% { transform: scale(0.25); opacity: 0; filter: brightness(3.2); }
        }

        /* Hiệu ứng lớn */
        #fx-burst {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; z-index: 250;
        }
        #fx-burst .icon {
            font-size: 140px;
            opacity: 0;
            filter: drop-shadow(0 14px 24px rgba(0,0,0,0.75));
        }
        #fx-burst.show-hole .icon { animation: fxHole 2.6s ease forwards; }
        #fx-burst.show-mine .icon { animation: fxMine 2.2s ease forwards; }
        #fx-burst.show-meteor .icon { animation: fxMeteor 2.6s ease forwards; }
        #fx-burst.show-lightning .icon { animation: fxLightning 2.2s ease forwards; }
        #fx-burst.show-fire .icon { animation: fxFire 2.4s ease forwards; }

        @keyframes fxHole {
            0% { opacity: 0; transform: scale(0.25) rotate(0deg); }
            40% { opacity: 1; transform: scale(1.4) rotate(12deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes fxMine {
            0% { opacity: 0; transform: scale(0.15); }
            30% { opacity: 1; transform: scale(1.7); }
            60% { opacity: 1; transform: scale(1.05); }
            100% { opacity: 1; transform: scale(1.35); }
        }
        @keyframes fxMeteor {
            0% { opacity: 1; transform: translateY(-360px) scale(0.4) rotate(-20deg); }
            65% { opacity: 1; transform: translateY(0) scale(1.3) rotate(5deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }
        @keyframes fxLightning {
            0% { opacity: 0; transform: scale(0.3) translateY(-40px); filter: brightness(3); }
            25% { opacity: 1; transform: scale(1.5); filter: brightness(2); }
            50% { opacity: 0.7; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1.25); filter: brightness(1.2); }
        }
        @keyframes fxFire {
            0% { opacity: 0; transform: scale(0.4) translateY(30px); }
            40% { opacity: 1; transform: scale(1.45) translateY(-10px); }
            100% { opacity: 1; transform: scale(1.15) translateY(0); }
        }

        #result-overlay {
            position: absolute; inset: 0;
            display: none; z-index: 300;
            justify-content: center; align-items: center; text-align: center;
            background: rgba(10,14,18,0.6);
            border-radius: 22px;
            backdrop-filter: blur(3px);
        }
        #result-overlay .box {
            padding: 24px 40px;
            border-radius: 18px;
            font-size: 24px;
            background: var(--panel);
            border: 2px solid rgba(255,255,255,0.12);
            box-shadow: 0 18px 45px rgba(0,0,0,0.55);
        }
        #result-overlay.success .box { color: var(--gold); border-color: var(--gold); }
        #result-overlay.fail .box { color: #ff5e57; border-color: #ff5e57; }

        /* ===== Controls (bảng điều khiển bên trái) ===== */
        .btn {
            height: calc(var(--u) * 38); padding: 0 calc(var(--u) * 6); border-radius: calc(var(--u) * 10); border: none; cursor: pointer;
            color: white; transition: 0.2s; font-size: max(11px, calc(var(--u) * 12)); line-height: 1.15; text-align: center;
            display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 5);
        }
        .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .setup-row { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 6); }
        .setup-row .full { grid-column: span 2; }
        .c-flag { background: linear-gradient(160deg, var(--pink-flag), #d63f5b); }
        .c-target { background: linear-gradient(160deg, var(--gold), #d4a521); color: #2b2200; }
        .c-multi { background: linear-gradient(160deg, #ffb347, #e07b00); color: #2b1600; }
        .c-multi.active { box-shadow: 0 0 0 3px #fff inset; background: linear-gradient(160deg, #6fcf6f, #3fa83f); color: #08210f; }

        .dir-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--u) * 6); }
        .btn-dir { height: calc(var(--u) * 50); flex-direction: column; gap: calc(var(--u) * 3); font-size: max(10px, calc(var(--u) * 11)); }
        .btn-dir svg { width: calc(var(--u) * 22); height: calc(var(--u) * 22); flex-shrink: 0; }
        .c-f { background: linear-gradient(160deg, var(--fwd), #039654); color: #08210f; }
        .c-b { background: linear-gradient(160deg, var(--bwd), #d6362d); }
        .c-l { background: linear-gradient(160deg, var(--lft), #2a4bb0); }
        .c-r { background: linear-gradient(160deg, var(--rgt), #d68600); color: #2b1c00; }

        .section.grow { flex: 1 1 auto; min-height: calc(var(--u) * 90); }
        .command-strip {
            flex: 1 1 auto; min-height: calc(var(--u) * 44);
            background: rgba(0,0,0,0.3); border-radius: calc(var(--u) * 12);
            padding: calc(var(--u) * 7); display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: min-content;
            gap: calc(var(--u) * 5); overflow-y: auto; border: 1px dashed rgba(255,255,255,0.12);
        }
        .mini-card {
            aspect-ratio: 1; border-radius: calc(var(--u) * 7);
            display: flex; align-items: center; justify-content: center;
            color: white; box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        .mini-card svg { width: 62%; height: 62%; }

        .edit-bar { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 6); }
        .btn-ghost {
            height: calc(var(--u) * 32); font-size: max(10px, calc(var(--u) * 11));
            background: rgba(255,255,255,0.05); color: #bdc3c7;
            border: 1px solid rgba(255,255,255,0.12);
        }
        .btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,0.15); color: #fff; }

        #start-btn {
            background: var(--accent); color: #0d1f0d; height: calc(var(--u) * 46); font-size: max(13px, calc(var(--u) * 16)); font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; border-radius: calc(var(--u) * 12); flex-shrink: 0;
        }
        #start-btn:disabled { background: #4b515a; color: #808e9b; opacity: 1; }
        #start-btn:hover:not(:disabled) { box-shadow: 0 0 25px var(--accent); transform: scale(1.02); filter: none; }

        .sidebar-foot { flex-shrink: 0; }
        .sidebar-foot .btn-ghost { width: 100%; }

        .board-hint {
            position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5;
            max-width: 92%; padding: 5px 14px; border-radius: 999px;
            background: rgba(0,0,0,0.45); color: #b8c4cd; font-size: 12px; font-weight: 700;
            text-align: center; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>GARDEN &amp; CITY HARVEST BOT 8×8 — 3D</h1>
        <div class="status-msg" id="msg">Sẵn sàng! Hãy chọn Điểm xuất phát và Mục tiêu để bắt đầu</div>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="section">
                <div class="section-label">Bản đồ</div>
                <div class="theme-tabs">
                    <button class="tab-btn active" id="tab-farm" onclick="loadTheme('farm')"><span class="ico">🌾</span>NÔNG TRẠI</button>
                    <button class="tab-btn" id="tab-city" onclick="loadTheme('city')"><span class="ico">🏙️</span>THÀNH PHỐ</button>
                    <button class="tab-btn" id="tab-jungle" onclick="loadTheme('jungle')"><span class="ico">🦁</span>RỪNG XANH</button>
                </div>
            </div>

            <div class="section">
                <div class="section-label">Thiết lập</div>
                <div class="setup-row">
                    <button class="btn c-flag full" id="flag-btn" onclick="enableFlagMode()">🚩 CHỌN ĐIỂM XUẤT PHÁT</button>
                    <button class="btn c-target" id="target-btn" onclick="enableTargetMode()">🎯 CHỌN MỤC TIÊU</button>
                    <button class="btn c-multi" id="multi-btn" onclick="toggleMultiMode()">🎯🎯 CHỌN NHIỀU MỤC TIÊU</button>
                </div>
            </div>

            <div class="section">
                <div class="section-label">Lập trình</div>
                <div class="dir-row">
                    <button class="btn btn-dir c-f" onclick="addCommand('F')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M12 20 L12 5"/><path d="M6 10 L12 4 L18 10"/></svg>TIẾN</button>
                    <button class="btn btn-dir c-b" onclick="addCommand('B')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M12 4 L12 19"/><path d="M6 14 L12 20 L18 14"/></svg>LÙI</button>
                    <button class="btn btn-dir c-l" onclick="addCommand('L')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"><path d="M18 18 L18 10 L8 10"/><path d="M12 6 L8 10 L12 14"/></svg>TRÁI</button>
                    <button class="btn btn-dir c-r" onclick="addCommand('R')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter"><path d="M6 18 L6 10 L16 10"/><path d="M12 6 L16 10 L12 14"/></svg>PHẢI</button>
                </div>
            </div>

            <div class="section grow">
                <div class="section-label">Lộ trình thu hoạch <b id="queue-count">0 lệnh</b></div>
                <div class="command-strip" id="queue-display"></div>
                <div class="edit-bar">
                    <button class="btn btn-ghost" onclick="undoCommand()">✖ XOÁ LỆNH CUỐI</button>
                    <button class="btn btn-ghost" onclick="clearCommands()">🗑 XOÁ TẤT CẢ</button>
                </div>
            </div>

            <button class="btn" id="start-btn" onclick="startRobot()" disabled>▶ BẮT ĐẦU</button>

            <div class="sidebar-foot">
                <button class="btn btn-ghost" onclick="loadTheme(currentTheme)">🔄 LÀM MỚI SA BÀN</button>
            </div>
        </div>

        <div class="grid-area" id="grid-area">
            <div class="board-stage" id="board-stage">
                <div class="board-3d">
                    <div class="grid-container" id="grid">
                        <div id="robot" onclick="rotateRobot(event)">
                          <div class="bot-rig">
                            <div class="bot-body"></div>
                            <div class="bot-visor"></div>
                            <div class="bot-tread l"></div><div class="bot-tread r"></div>
                            <div class="arm l"></div><div class="arm r"></div>
                            <div class="eye l"></div><div class="eye r"></div>
                            <div class="antenna"></div>
                            <div class="dir-arrow">⬆️</div>
                          </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="board-hint">💡 Kéo thả địa điểm để đổi vị trí · thả lên địa điểm khác để hoán đổi</div>
            <div id="fx-burst"></div>
            <div id="result-overlay"><div class="box" id="result-box"></div></div>
        </div>
    </div>

    <script>
        const GRID_SIZE = 8;
        const NUM_TARGETS = 5;

        const THEMES = {
            farm: {
                groundClass: 'ground-farm', roadClass: 'road-farm',
                targetIcons: ['🍎', '🥕', '🍅', '🌽', '🍓'],
                targetNames: ['Quả táo', 'Cà rốt', 'Cà chua', 'Bắp ngô', 'Dâu tây'],
                decorIcons: ['🌻', '🐝', '🌳', '🐓', '🪵', '🌾']
            },
            city: {
                groundClass: 'ground-city', roadClass: 'road-city',
                targetIcons: ['🏥', '🌳', '🍽️', '🎬', '🦁'],
                targetNames: ['Bệnh viện', 'Công viên', 'Nhà hàng', 'Rạp chiếu phim', 'Sở thú'],
                decorIcons: ['🚗', '🚦', '🏢', '🚌', '🏢', '🚕']
            },
            jungle: {
                groundClass: 'ground-jungle', roadClass: 'road-jungle',
                targetIcons: ['🐒', '🐘', '🦁', '🐢', '🦒'],
                targetNames: ['Khỉ', 'Voi', 'Sư tử', 'Rùa', 'Hươu cao cổ'],
                decorIcons: ['🌴', '🌿', '🦜', '🌳', '🍃', '🌺']
            }
        };

        const FAIL_EFFECTS = [
            { kind: 'hole',      icon: '🕳️', msg: '😱 Robot rơi xuống hố! Sai mục tiêu rồi!', result: '😱 THẤT BẠI! Robot đã rơi xuống hố ở sai mục tiêu.' },
            { kind: 'mine',      icon: '💥', msg: '💥 Robot trúng mìn! Sai mục tiêu rồi!', result: '💥 THẤT BẠI! Robot đã trúng mìn ở sai mục tiêu.' },
            { kind: 'meteor',    icon: '☄️', msg: '☄️ Thiên thạch rơi trúng Robot!', result: '☄️ THẤT BẠI! Một thiên thạch đã rơi trúng Robot ở sai mục tiêu.' },
            { kind: 'lightning', icon: '⚡', msg: '⚡ Sét đánh trúng Robot!', result: '⚡ THẤT BẠI! Robot bị sét đánh ở sai mục tiêu.' },
            { kind: 'fire',      icon: '🔥', msg: '🔥 Robot bị cháy! Sai mục tiêu rồi!', result: '🔥 THẤT BẠI! Robot đã bị thiêu cháy ở sai mục tiêu.' }
        ];

        let currentTheme = 'farm';
        let robotPos = { x: 0, y: 0, dir: 0 };
        let commandList = [];
        let isFlagMode = false;
        let isTargetMode = false;
        let isMultiMode = false;
        let isMoving = false;
        let startPlaced = false;
        let targetPlaced = false;
        let targetSeq = [];      // danh sách mục tiêu theo thứ tự cần đến
        let targetTiles = [];

        // Bản đồ động (được random mỗi lần làm mới)
        let ROAD_SET = new Set();
        let TARGET_POSITIONS = [];
        let DECOR_SPOTS = [];

        function cellKey(x, y) { return `${x},${y}`; }

        function randInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        /** Tạo mạng đường ngẫu nhiên + 5 mục tiêu + vài decor */
        function generateMap() {
            ROAD_SET = new Set();
            TARGET_POSITIONS = [];
            DECOR_SPOTS = [];

            // 1. Chọn 1 hàng ngang và 1 cột dọc làm trục chính (không quá sát mép)
            const mainRow = randInt(2, 5);
            const mainCol = randInt(2, 5);

            for (let x = 0; x < GRID_SIZE; x++) ROAD_SET.add(cellKey(x, mainRow));
            for (let y = 0; y < GRID_SIZE; y++) ROAD_SET.add(cellKey(mainCol, y));

            // 2. Thêm vài nhánh phụ (đường ngang/dọc ngắn)
            const numBranches = randInt(3, 6);
            for (let i = 0; i < numBranches; i++) {
                if (Math.random() < 0.5) {
                    // nhánh ngang
                    const y = randInt(0, GRID_SIZE - 1);
                    const xStart = randInt(0, 4);
                    const len = randInt(2, 4);
                    for (let x = xStart; x < Math.min(GRID_SIZE, xStart + len); x++) {
                        ROAD_SET.add(cellKey(x, y));
                    }
                } else {
                    // nhánh dọc
                    const x = randInt(0, GRID_SIZE - 1);
                    const yStart = randInt(0, 4);
                    const len = randInt(2, 4);
                    for (let y = yStart; y < Math.min(GRID_SIZE, yStart + len); y++) {
                        ROAD_SET.add(cellKey(x, y));
                    }
                }
            }

            // 3. Đặt 5 mục tiêu trên ô KHÔNG phải đường, ưu tiên gần đường
            const candidates = [];
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const key = cellKey(x, y);
                    if (ROAD_SET.has(key)) continue;
                    // kiểm tra có tiếp giáp đường không
                    const nearRoad =
                        ROAD_SET.has(cellKey(x - 1, y)) ||
                        ROAD_SET.has(cellKey(x + 1, y)) ||
                        ROAD_SET.has(cellKey(x, y - 1)) ||
                        ROAD_SET.has(cellKey(x, y + 1));
                    candidates.push({ x, y, nearRoad });
                }
            }

            // Ưu tiên ô gần đường
            candidates.sort((a, b) => (b.nearRoad ? 1 : 0) - (a.nearRoad ? 1 : 0));
            // Xáo trộn nhẹ trong nhóm gần đường
            const near = candidates.filter(c => c.nearRoad);
            const far  = candidates.filter(c => !c.nearRoad);
            shuffle(near);
            shuffle(far);
            const ordered = near.concat(far);

            const used = new Set();
            for (const c of ordered) {
                if (TARGET_POSITIONS.length >= NUM_TARGETS) break;
                const k = cellKey(c.x, c.y);
                if (used.has(k)) continue;
                // tránh đặt quá gần nhau
                let tooClose = false;
                for (const t of TARGET_POSITIONS) {
                    if (Math.abs(t.x - c.x) + Math.abs(t.y - c.y) < 2) {
                        tooClose = true;
                        break;
                    }
                }
                if (tooClose) continue;
                TARGET_POSITIONS.push({ x: c.x, y: c.y });
                used.add(k);
            }

            // Bổ sung nếu thiếu
            while (TARGET_POSITIONS.length < NUM_TARGETS) {
                const x = randInt(0, GRID_SIZE - 1);
                const y = randInt(0, GRID_SIZE - 1);
                const k = cellKey(x, y);
                if (ROAD_SET.has(k) || used.has(k)) continue;
                TARGET_POSITIONS.push({ x, y });
                used.add(k);
            }

            // 4. Decor trên ô còn trống (không đường, không mục tiêu)
            const free = [];
            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const k = cellKey(x, y);
                    if (!ROAD_SET.has(k) && !used.has(k)) free.push({ x, y });
                }
            }
            shuffle(free);
            const numDecor = Math.min(6, free.length);
            for (let i = 0; i < numDecor; i++) {
                DECOR_SPOTS.push(free[i]);
            }
        }

        function shuffle(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function loadTheme(themeKey) {
            currentTheme = themeKey;
            document.getElementById('tab-farm').classList.toggle('active', themeKey === 'farm');
            document.getElementById('tab-city').classList.toggle('active', themeKey === 'city');
            document.getElementById('tab-jungle').classList.toggle('active', themeKey === 'jungle');

            // Random lại bản đồ mỗi lần làm mới
            generateMap();

            commandList = []; isFlagMode = false; isTargetMode = false; isMultiMode = false; isMoving = false;
            startPlaced = false; targetPlaced = false; targetSeq = []; targetTiles = [];
            updateMultiBtn();
            document.getElementById('result-overlay').style.display = 'none';
            const fxLayer = document.getElementById('fx-burst');
            fxLayer.className = ''; fxLayer.innerHTML = '';
            document.getElementById('board-stage').classList.remove('shake');
            updateQueueUI();

            buildGrid();
            const rb = document.getElementById('robot');
            rb.style.display = 'none';
            rb.className = '';
            document.getElementById('msg').innerText = 'Sẵn sàng! Hãy chọn Điểm xuất phát và Mục tiêu để bắt đầu';
            updateStartButton();
        }

        function buildGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.querySelectorAll('.cell').forEach(c => c.remove());
            const theme = THEMES[currentTheme];
            const robotEl = document.getElementById('robot');
            targetTiles = [];

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const key = cellKey(x, y);
                    const targetIdx = TARGET_POSITIONS.findIndex(t => t.x === x && t.y === y);

                    if (targetIdx !== -1) {
                        cell.classList.add(theme.groundClass, 'target-tile');
                        const icon = document.createElement('span');
                        icon.className = 'target-icon';
                        icon.innerText = theme.targetIcons[targetIdx];
                        cell.appendChild(icon);
                        const label = document.createElement('div');
                        label.className = 'target-label';
                        label.innerText = theme.targetNames[targetIdx];
                        // hàng xa (phía trên) bị perspective làm nhỏ -> phóng nhãn lên cho đều
                        label.style.setProperty('--ls', (1.22 - y * 0.04).toFixed(2));
                        cell.appendChild(label);
                        cell.dataset.targetIdx = targetIdx;
                        targetTiles.push({ el: cell, x, y });
                    } else if (ROAD_SET.has(key)) {
                        cell.classList.add(theme.roadClass);
                    } else {
                        cell.classList.add(theme.groundClass);
                        const decorIdx = DECOR_SPOTS.findIndex(d => d.x === x && d.y === y);
                        if (decorIdx !== -1) {
                            const span = document.createElement('span');
                            span.className = 'decor';
                            span.innerText = theme.decorIcons[decorIdx % theme.decorIcons.length];
                            cell.appendChild(span);
                        }
                    }

                    cell.onclick = () => handleCellClick(x, y, cell);
                    gridEl.insertBefore(cell, robotEl);
                }
            }
        }

        function updateStartButton() {
            document.getElementById('start-btn').disabled = !(startPlaced && targetPlaced) || isMoving || isMultiMode;
        }

        function clearSelectableHighlight() {
            document.querySelectorAll('.cell.selectable-target').forEach(el => el.classList.remove('selectable-target'));
        }

        function updateMultiBtn() {
            const btn = document.getElementById('multi-btn');
            btn.classList.toggle('active', isMultiMode);
            btn.innerHTML = isMultiMode
                ? `✔ XONG (${targetSeq.length})`
                : '🎯🎯 CHỌN NHIỀU MỤC TIÊU';
        }

        /** Vẽ lại số thứ tự (badge) trên các mục tiêu đã chọn */
        function renderTargetMarks() {
            targetTiles.forEach(t => {
                t.el.classList.remove('target-cell', 'target-reached', 'target-wrong');
                const old = t.el.querySelector('.target-badge');
                if (old) old.remove();
            });
            const multi = targetSeq.length > 1 || isMultiMode;
            targetSeq.forEach((p, i) => {
                const t = findTargetAt(p.x, p.y);
                if (!t) return;
                if (multi) {
                    const badge = document.createElement('div');
                    badge.className = 'target-badge';
                    badge.innerText = i + 1;
                    t.el.appendChild(badge);
                } else {
                    t.el.classList.add('target-cell'); // dấu ⭐ cho mục tiêu đơn
                }
            });
        }

        function enableFlagMode() {
            if (isMoving) return;
            isFlagMode = true; isTargetMode = false;
            if (isMultiMode) { isMultiMode = false; updateMultiBtn(); renderTargetMarks(); }
            document.getElementById('msg').innerText = 'Nhấn vào 1 ô bất kỳ trong sa bàn để đặt Robot!';
            document.querySelectorAll('.cell').forEach(el => {
                if (!el.classList.contains('target-tile')) el.classList.add('highlight-start');
            });
            clearSelectableHighlight();
            updateStartButton();
        }

        function enableTargetMode() {
            if (isMoving) return;
            isTargetMode = true; isFlagMode = false;
            if (isMultiMode) { isMultiMode = false; updateMultiBtn(); }
            targetSeq = []; targetPlaced = false;
            renderTargetMarks();
            document.getElementById('msg').innerText = 'Nhấn vào 1 địa điểm để đặt làm MỤC TIÊU!';
            document.querySelectorAll('.cell.highlight-start').forEach(el => el.classList.remove('highlight-start'));
            targetTiles.forEach(t => t.el.classList.add('selectable-target'));
            updateStartButton();
        }

        /** Bật/tắt chế độ chọn nhiều mục tiêu theo thứ tự */
        function toggleMultiMode() {
            if (isMoving) return;
            if (isMultiMode) {
                // Bấm lần nữa = XONG
                isMultiMode = false;
                clearSelectableHighlight();
                targetPlaced = targetSeq.length > 0;
                updateMultiBtn();
                renderTargetMarks();
                document.getElementById('msg').innerText = targetSeq.length === 0
                    ? 'Bạn chưa chọn mục tiêu nào!'
                    : (startPlaced ? `Đã chọn ${targetSeq.length} mục tiêu theo thứ tự. Hãy lập trình các bước đi!`
                                   : `Đã chọn ${targetSeq.length} mục tiêu. Giờ hãy chọn Điểm xuất phát!`);
                updateStartButton();
                return;
            }
            isMultiMode = true; isTargetMode = false; isFlagMode = false;
            targetSeq = []; targetPlaced = false;
            document.querySelectorAll('.cell.highlight-start').forEach(el => el.classList.remove('highlight-start'));
            targetTiles.forEach(t => t.el.classList.add('selectable-target'));
            updateMultiBtn();
            renderTargetMarks();
            document.getElementById('msg').innerText = 'Nhấn lần lượt các mục tiêu theo THỨ TỰ cần đến, xong bấm ✔ XONG (bấm lại mục tiêu để bỏ chọn)';
            updateStartButton();
        }

        function handleCellClick(x, y, cellEl) {
            if (suppressClick) return;
            if (isFlagMode) {
                if (cellEl.classList.contains('target-tile')) return;
                robotPos.x = x; robotPos.y = y; robotPos.dir = 0;
                renderRobot();
                isFlagMode = false; startPlaced = true;
                document.getElementById('msg').innerText = 'Đã đặt Robot. Bấm vào Robot để xoay hướng, hoặc chọn Mục tiêu!';
                document.querySelectorAll('.cell').forEach(el => el.classList.remove('highlight-start'));
                updateStartButton();
                return;
            }

            if (isTargetMode) {
                if (!cellEl.classList.contains('target-tile')) return;
                targetSeq = [{ x, y }];
                isTargetMode = false; targetPlaced = true;
                clearSelectableHighlight();
                renderTargetMarks();
                document.getElementById('msg').innerText = startPlaced
                    ? 'Đã sẵn sàng! Hãy lập trình các bước đi!'
                    : 'Đã đặt Mục tiêu. Giờ hãy chọn Điểm xuất phát!';
                updateStartButton();
                return;
            }

            if (isMultiMode) {
                if (!cellEl.classList.contains('target-tile')) return;
                const idx = targetSeq.findIndex(p => p.x === x && p.y === y);
                if (idx !== -1) targetSeq.splice(idx, 1);   // bấm lại -> bỏ chọn
                else targetSeq.push({ x, y });
                renderTargetMarks();
                updateMultiBtn();
                document.getElementById('msg').innerText = targetSeq.length
                    ? `Đã chọn ${targetSeq.length} mục tiêu. Chọn tiếp hoặc bấm ✔ XONG`
                    : 'Nhấn lần lượt các mục tiêu theo THỨ TỰ cần đến';
                return;
            }
        }

        function rotateRobot(e) {
            e.stopPropagation();
            if (isMoving || !startPlaced) return;
            robotPos.dir = (robotPos.dir + 1) % 4;
            renderRobot();
        }

        function addCommand(cmd) {
            if (isMoving || isFlagMode || isTargetMode || isMultiMode) return;
            commandList.push(cmd);
            updateQueueUI();
        }
        function undoCommand() { if (!isMoving) { commandList.pop(); updateQueueUI(); } }
        function clearCommands() { if (!isMoving) { commandList = []; updateQueueUI(); } }

        const ARROW_SVG = {
            F: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M12 20 L12 5"/><path d="M6 10 L12 4 L18 10"/></svg>',
            B: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M12 4 L12 19"/><path d="M6 14 L12 20 L18 14"/></svg>',
            L: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M18 18 L18 10 L8 10"/><path d="M12 6 L8 10 L12 14"/></svg>',
            R: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M6 18 L6 10 L16 10"/><path d="M12 6 L16 10 L12 14"/></svg>'
        };

        function updateQueueUI() {
            const container = document.getElementById('queue-display');
            container.innerHTML = '';
            commandList.forEach(cmd => {
                const div = document.createElement('div');
                div.className = `mini-card c-${cmd.toLowerCase()}`;
                div.innerHTML = ARROW_SVG[cmd];
                container.appendChild(div);
            });
            document.getElementById('queue-count').innerText = `${commandList.length} lệnh`;
        }

        // Kích thước lưới: padding 16px mỗi bên + khoảng cách 5px giữa các ô
        const GRID_PAD = 16, GRID_GAP = 5;
        function renderRobot() {
            const rb = document.getElementById('robot');
            rb.style.display = 'block';
            // cạnh 1 ô = (toàn bộ - 2*padding - (n-1)*gap) / n
            const cell = `((100% - ${2 * GRID_PAD + (GRID_SIZE - 1) * GRID_GAP}px) / ${GRID_SIZE})`;
            const size = `(${cell} * 0.6)`;               // robot vuông, nhỏ hơn ô để xoay không tràn
            const offset = `(${cell} * 0.2)`;             // căn giữa robot trong ô
            rb.style.width = `calc${size}`;
            rb.style.height = `calc${size}`;
            rb.style.left = `calc(${GRID_PAD}px + ${robotPos.x} * (${cell} + ${GRID_GAP}px) + ${offset})`;
            rb.style.top = `calc(${GRID_PAD}px + ${robotPos.y} * (${cell} + ${GRID_GAP}px) + ${offset})`;
            rb.style.transform = `translateZ(6px) rotate(${robotPos.dir * 90}deg)`;
        }

        function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

        function showResult(type, text) {
            const overlay = document.getElementById('result-overlay');
            overlay.className = type;
            document.getElementById('result-box').innerText = text;
            overlay.style.display = 'flex';
        }

        async function triggerSuccess(cellEl, total = 1) {
            const rb = document.getElementById('robot');
            cellEl.classList.add('fx-success');
            rb.classList.add('state-success');
            document.getElementById('msg').innerText = total > 1 ? `🎉 TUYỆT VỜI! ĐÃ ĐI ĐỦ ${total} MỤC TIÊU ĐÚNG THỨ TỰ!` : '🎉 CHÍNH XÁC! ĐÃ ĐẾN ĐÚNG MỤC TIÊU!';
            await sleep(500);
            showResult('success', total > 1 ? `🎉 THÀNH CÔNG! Robot đã đi đủ ${total} mục tiêu đúng thứ tự!` : '🎉 THÀNH CÔNG! Robot đã đến đúng mục tiêu!');
            await sleep(2200);
            loadTheme(currentTheme);
        }

        function playFxBurst(kind, icon) {
            const layer = document.getElementById('fx-burst');
            layer.className = '';
            layer.innerHTML = '';
            const el = document.createElement('div');
            el.className = 'icon';
            el.innerText = icon;
            layer.appendChild(el);
            layer.classList.add('show-' + kind);
        }

        async function triggerFail(cellEl, effect) {
            const rb = document.getElementById('robot');
            const stage = document.getElementById('board-stage');
            playFxBurst(effect.kind, effect.icon);
            stage.classList.add('shake');

            if (effect.kind === 'hole') {
                cellEl.classList.add('fx-hole');
                rb.classList.add('state-fail-hole');
            } else {
                cellEl.classList.add('fx-mine');
                rb.classList.add('state-fail-mine');
            }

            document.getElementById('msg').innerText = effect.msg;

            await sleep(2800);
            showResult('fail', effect.result);
            await sleep(3500);
            loadTheme(currentTheme);
        }

        async function triggerOffgrid() {
            document.getElementById('msg').innerText = '🚫 Robot đã đi ra ngoài sa bàn!';
            showResult('fail', '🚫 THẤT BẠI! Robot đã rơi khỏi sa bàn.');
            await sleep(2000);
            loadTheme(currentTheme);
        }

        function findTargetAt(x, y) {
            return targetTiles.find(t => t.x === x && t.y === y) || null;
        }

        async function startRobot() {
            if (isMoving || commandList.length === 0 || !startPlaced || !targetPlaced || isMultiMode) return;
            isMoving = true;
            document.getElementById('start-btn').disabled = true;
            document.getElementById('robot').classList.add('state-thinking');
            document.getElementById('msg').innerText = 'Robot đang di chuyển...';

            // reset trạng thái "đã qua" của các mục tiêu
            renderTargetMarks();

            const visited = [];      // các mục tiêu robot đã bước vào (theo thứ tự)
            let nextIdx = 0;         // mục tiêu kế tiếp cần đến

            // Chạy HẾT toàn bộ lệnh, chỉ đánh giá kết quả sau lệnh cuối cùng
            for (let cmd of commandList) {
                await sleep(650);
                let moved = false;
                if (cmd === 'F' || cmd === 'B') {
                    let move = (cmd === 'F') ? 1 : -1;
                    if (robotPos.dir === 0) robotPos.y -= move;
                    else if (robotPos.dir === 1) robotPos.x += move;
                    else if (robotPos.dir === 2) robotPos.y += move;
                    else if (robotPos.dir === 3) robotPos.x -= move;
                    moved = true;
                } else if (cmd === 'L') {
                    robotPos.dir = (robotPos.dir + 3) % 4;
                } else if (cmd === 'R') {
                    robotPos.dir = (robotPos.dir + 1) % 4;
                }

                if (robotPos.x < 0 || robotPos.x >= GRID_SIZE || robotPos.y < 0 || robotPos.y >= GRID_SIZE) {
                    await triggerOffgrid();
                    return;
                }
                renderRobot();

                if (moved) {
                    const hit = findTargetAt(robotPos.x, robotPos.y);
                    if (hit) {
                        const isSelected = targetSeq.some(p => p.x === hit.x && p.y === hit.y);

                        if (!isSelected) {
                            // Đi vào địa điểm KHÔNG phải mục tiêu -> thất bại ngay (kể cả chỉ đi ngang qua)
                            await sleep(650); // chờ robot trượt tới nơi để học sinh nhìn thấy
                            document.getElementById('robot').classList.remove('state-thinking');
                            hit.el.classList.add('target-wrong');
                            const effect = FAIL_EFFECTS[Math.floor(Math.random() * FAIL_EFFECTS.length)];
                            await triggerFail(hit.el, effect);
                            return;
                        }

                        const last = visited[visited.length - 1];
                        if (!last || last.x !== hit.x || last.y !== hit.y) visited.push({ x: hit.x, y: hit.y });

                        const expect = targetSeq[nextIdx];
                        if (expect && expect.x === hit.x && expect.y === hit.y) {
                            hit.el.classList.add('target-reached');
                            nextIdx++;
                            document.getElementById('msg').innerText =
                                `✅ Đã qua mục tiêu ${nextIdx}/${targetSeq.length}... Robot vẫn phải chạy hết các lệnh!`;
                        }
                    }
                }
            }

            // ===== Đã chạy hết lệnh -> đánh giá kết quả =====
            document.getElementById('robot').classList.remove('state-thinking');

            const atFinal = targetSeq[targetSeq.length - 1];
            const endTile = findTargetAt(robotPos.x, robotPos.y);
            const endsOnLast = atFinal && robotPos.x === atFinal.x && robotPos.y === atFinal.y;
            const orderOk = visited.length === targetSeq.length &&
                visited.every((v, i) => v.x === targetSeq[i].x && v.y === targetSeq[i].y);

            if (endsOnLast && orderOk) {
                await triggerSuccess(endTile.el, targetSeq.length);
            } else if (endTile) {
                // dừng lại ở một địa điểm sai -> hiệu ứng thất bại
                const effect = FAIL_EFFECTS[Math.floor(Math.random() * FAIL_EFFECTS.length)];
                await triggerFail(endTile.el, effect);
            } else {
                document.getElementById('msg').innerText = targetSeq.length > 1
                    ? 'Đã hết lệnh nhưng chưa hoàn thành đủ các mục tiêu theo thứ tự. Thử lại lộ trình khác nhé!'
                    : 'Đã hết lệnh nhưng chưa tới mục tiêu. Thử lại lộ trình khác nhé!';
                isMoving = false;
                updateStartButton();
            }
        }

        // ===== KÉO THẢ ĐỊA ĐIỂM =====
        let suppressClick = false;
        let drag = null;

        function cellAtPoint(clientX, clientY) {
            const robotEl = document.getElementById('robot');
            const old = robotEl.style.pointerEvents;
            robotEl.style.pointerEvents = 'none';
            const el = document.elementFromPoint(clientX, clientY);
            robotEl.style.pointerEvents = old;
            return el ? el.closest('.cell') : null;
        }

        function cellCoords(cellEl) {
            const cells = Array.from(document.querySelectorAll('#grid .cell'));
            const i = cells.indexOf(cellEl);
            return { x: i % GRID_SIZE, y: Math.floor(i / GRID_SIZE) };
        }

        function robotAt(x, y) {
            return startPlaced && robotPos.x === x && robotPos.y === y;
        }

        function clearDropMarks() {
            document.querySelectorAll('.cell.drop-hover, .cell.drop-denied').forEach(el => el.classList.remove('drop-hover', 'drop-denied'));
        }

        document.getElementById('grid').addEventListener('pointerdown', e => {
            if (isMoving || isFlagMode) return;
            const cell = e.target.closest('.cell.target-tile');
            if (!cell) return;
            const pos = cellCoords(cell);
            drag = {
                idx: TARGET_POSITIONS.findIndex(t => t.x === pos.x && t.y === pos.y),
                cell, startX: e.clientX, startY: e.clientY, active: false, ghost: null
            };
        });

        window.addEventListener('pointermove', e => {
            if (!drag) return;
            if (!drag.active) {
                if (Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) < 8) return;
                drag.active = true;
                drag.cell.classList.add('dragging-src');
                const ghost = document.createElement('div');
                ghost.id = 'drag-ghost';
                ghost.innerText = THEMES[currentTheme].targetIcons[drag.idx];
                document.body.appendChild(ghost);
                drag.ghost = ghost;
                document.getElementById('msg').innerText = 'Kéo địa điểm tới ô mới rồi thả ra!';
            }
            drag.ghost.style.left = e.clientX + 'px';
            drag.ghost.style.top = e.clientY + 'px';
            clearDropMarks();
            const over = cellAtPoint(e.clientX, e.clientY);
            if (over && over !== drag.cell) {
                const p = cellCoords(over);
                over.classList.add(robotAt(p.x, p.y) ? 'drop-denied' : 'drop-hover');
            }
        });

        window.addEventListener('pointerup', e => {
            if (!drag) return;
            const d = drag; drag = null;
            if (!d.active) return;               // chỉ là click bình thường
            suppressClick = true;
            setTimeout(() => { suppressClick = false; }, 0);
            clearDropMarks();
            d.cell.classList.remove('dragging-src');
            if (d.ghost) d.ghost.remove();

            const over = cellAtPoint(e.clientX, e.clientY);
            if (!over || over === d.cell) return;
            const to = cellCoords(over);
            if (robotAt(to.x, to.y)) {
                document.getElementById('msg').innerText = '🚫 Không thể đặt địa điểm lên ô đang có Robot!';
                return;
            }
            moveTarget(d.idx, to.x, to.y);
        });

        /** Chuyển mục tiêu idx tới (x,y); nếu ô đó đã có địa điểm khác thì hoán đổi */
        function moveTarget(idx, x, y) {
            const from = { ...TARGET_POSITIONS[idx] };
            const otherIdx = TARGET_POSITIONS.findIndex(t => t.x === x && t.y === y);

            // cập nhật tọa độ trong danh sách mục tiêu đã chọn (targetSeq)
            const remap = (p) => {
                if (p.x === from.x && p.y === from.y) return { x, y };
                if (otherIdx !== -1 && p.x === x && p.y === y) return { x: from.x, y: from.y };
                return p;
            };
            targetSeq = targetSeq.map(remap);

            if (otherIdx !== -1) TARGET_POSITIONS[otherIdx] = from;
            TARGET_POSITIONS[idx] = { x, y };

            // ô đích không còn đồ trang trí
            DECOR_SPOTS = DECOR_SPOTS.filter(d => !(d.x === x && d.y === y));
            // nếu ô cũ không phải đường thì để trống, có thể thêm decor lại: bỏ qua cho đơn giản

            buildGrid();
            renderTargetMarks();
            if (isTargetMode || isMultiMode) targetTiles.forEach(t => t.el.classList.add('selectable-target'));
            document.getElementById('msg').innerText = '✅ Đã đổi vị trí địa điểm. Có thể kéo tiếp hoặc lập trình robot!';
        }

        // Khởi tạo
        loadTheme('farm');
    </script>
